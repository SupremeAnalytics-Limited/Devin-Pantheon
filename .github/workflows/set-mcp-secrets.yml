name: Set MCP Worker Secrets

# Manual only — run this once (or whenever a key rotates) from the Actions tab.
# It never runs automatically, so it can never overwrite a live secret with an
# empty value just because a GitHub secret hasn't been added yet.
on:
  workflow_dispatch: {}

jobs:
  set-paystack-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: mcp-servers/paystack-mcp
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mcp-servers/paystack-mcp
          secrets: |
            PAYSTACK_SECRET_KEY
        env:
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}

  set-manus-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: mcp-servers/manus-mcp
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mcp-servers/manus-mcp
          secrets: |
            MANUS_API_KEY
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
